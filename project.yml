name: Lingo
options:
  bundleIdPrefix: io.github.litaoran
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    exactVersion: "0.1.4"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
targets:
  Lingo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lingo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Lingo contributors. MIT License."
        NSMicrophoneUsageDescription: "Lingo records your voice while you hold the dictation shortcut and transcribes it on this Mac. Audio never leaves your computer."
    entitlements:
      path: App/Lingo.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.litaoran.Lingo
        PRODUCT_NAME: Lingo
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioSTT
      - package: KeyboardShortcuts
  lingo-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: lingo-cli
        PRODUCT_BUNDLE_IDENTIFIER: io.github.litaoran.Lingo.cli
    dependencies:
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioSTT
schemes:
  Lingo:
    build:
      targets:
        Lingo: all
    run:
      config: Debug
    archive:
      config: Release
  lingo-cli:
    build:
      targets:
        lingo-cli: all
    run:
      config: Release
